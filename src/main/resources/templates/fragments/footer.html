
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Footer - Librería PUCE</title>
</head>

<body>

<footer th:fragment="footer_pa"
        class="bg-[#DCE5EF] border-t border-gray-300 mt-auto">

  <div class="max-w-screen-xl px-6 py-7 mx-auto">

    <div class="flex flex-col items-center justify-between gap-4 sm:flex-row">

      <!-- Nombre de la librería -->
      <div class="text-center sm:text-left">

        <h2 class="text-lg font-bold text-[#26384D]">
          Librería <span class="text-blue-700">PUCE</span>
        </h2>

        <p class="text-sm text-gray-600 mt-1">
          Un espacio para descubrir nuevas historias.
        </p>

      </div>

      <!-- Derechos reservados -->
      <div class="text-center sm:text-right">

        <p class="text-sm text-gray-600">
          © 2026 Librería PUCE.
        </p>

        <p class="text-xs text-gray-500 mt-1">
          Todos los derechos reservados.
        </p>

      </div>

    </div>

  </div>

</footer>

</body>
</html>
