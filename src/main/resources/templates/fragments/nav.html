
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Navegación - Librería PUCE</title>
</head>

<body>

<nav th:fragment="navbar" class="bg-[#F8FAFC] border-b border-gray-200">

    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto px-6 py-4">

        <!-- Logo y nombre -->
        <a th:href="@{/}" class="flex items-center gap-3">

            <img th:src="@{/images/libro-de-hechizos.png}"
                 class="h-10 w-10 object-contain"
                 alt="Logo Librería PUCE">

            <span class="text-xl font-bold text-[#26384D]">
                Librería <span class="text-blue-600">PUCE</span>
            </span>

        </a>

        <!-- Botón móvil -->
        <button data-collapse-toggle="navbar-default"
                type="button"
                class="inline-flex items-center p-2 w-10 h-10 justify-center text-gray-500 rounded-md md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
                aria-controls="navbar-default"
                aria-expanded="false">

            <span class="sr-only">Abrir menú</span>

            <svg class="w-6 h-6"
                 aria-hidden="true"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24">

                <path stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 6h16M4 12h16M4 18h16"/>

            </svg>

        </button>

        <!-- Enlaces -->
        <div class="hidden w-full md:block md:w-auto" id="navbar-default">

            <ul class="flex flex-col md:flex-row md:items-center gap-2 md:gap-8 mt-4 md:mt-0 font-medium">

                <li>
                    <a th:href="@{/}"
                       class="block py-2 px-3 text-blue-700 hover:text-blue-900 transition-colors">
                        Inicio
                    </a>
                </li>

                <li>
                    <a th:href="@{/libros/formulario}"
                       class="block py-2 px-3 text-gray-600 hover:text-blue-700 transition-colors">
                        Libros
                    </a>
                </li>

                <li>
                    <a href="#"
                       class="block py-2 px-3 text-gray-600 hover:text-blue-700 transition-colors">
                        Autores
                    </a>
                </li>

                <li>
                    <a href="#"
                       class="block py-2 px-3 text-gray-600 hover:text-blue-700 transition-colors">
                        Usuarios
                    </a>
                </li>

                <li>
                    <a href="#"
                       class="block py-2 px-3 text-gray-600 hover:text-blue-700 transition-colors">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

</body>
</html>
